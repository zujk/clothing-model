name: Meal planner (Android APK + server tests)

on:
  push:
    paths:
      - "meal-planner/**"
      - ".github/workflows/meal-planner-android.yml"
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test.js
        working-directory: meal-planner/server

  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meal-planner/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lista-spesa-apk
          path: meal-planner/android/app/build/outputs/apk/debug/app-debug.apk
